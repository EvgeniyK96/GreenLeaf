<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Партнёрская программа GreenLeaf Family — страница партнёра</title>
    <meta
      name="description"
      content="Партнёрская цена на уход, гигиену и бытовую химию вдвое ниже розничной. Калькулятор экономии, 11 видов начислений с условиями, стартовые наборы и честные ответы. Встреча или регистрация по ID."
    />
    <meta name="theme-color" content="#2b7a4b" />
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Те же покупки для дома — чек вдвое меньше" />
    <meta
      property="og:description"
      content="Партнёрская программа GreenLeaf Family: экономия по прайсу, понятные условия начислений, встреча или регистрация по ID."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/src/assets/fonts/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Флаги до первой отрисовки. Без JS ничего не прячется: заставки нет, блоки видны сразу.
      ;(function () {
        var d = document.documentElement
        var rm = false
        try {
          rm = matchMedia('(prefers-reduced-motion: reduce)').matches
        } catch (e) {}
        d.classList.add('js')
        if (!rm) {
          var seen = false
          try {
            seen = sessionStorage.getItem('gl-splash') === '1'
            sessionStorage.setItem('gl-splash', '1')
          } catch (e) {}
          if (!seen) d.classList.add('splash') // заставка — один раз за визит
          if ('IntersectionObserver' in window) d.classList.add('reveal') // появление блоков при прокрутке
        }
        // Клик по кнопке заявки до загрузки приложения: не прокручиваем вниз, а запоминаем —
        // окно откроется, как только приложение загрузится (components/LeadModal.tsx).
        document.addEventListener('click', function (e) {
          if (window.__glLeadReady || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
          var a = e.target && e.target.closest && e.target.closest('a[href="#zayavka"]')
          if (!a) return
          e.preventDefault()
          window.__glLeadPending = a.getAttribute('data-step') || 'any'
        })
      })()
    </script>
    <style>
      /* Заставка: росток вырастает, затем всё растворяется (~1,3 с). Только при html.splash. */
      #gl-splash {
        display: none;
      }
      html.splash #gl-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: radial-gradient(80% 60% at 50% 42%, #eff6ea 0%, #fff 70%);
        animation: gls-out 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
      }
      .gls-mark {
        animation: gls-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .gls-stem {
        stroke-dasharray: 26;
        stroke-dashoffset: 26;
        animation: gls-draw 0.35s 0.12s ease-out forwards;
      }
      .gls-leaf1,
      .gls-leaf2 {
        transform-box: fill-box;
        transform: scale(0);
        animation: gls-grow 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .gls-leaf1 {
        transform-origin: 0 100%;
        animation-delay: 0.32s;
      }
      .gls-leaf2 {
        transform-origin: 100% 100%;
        animation-delay: 0.46s;
      }
      .gls-name {
        font: 650 17px/1.2 'Unbounded Variable', system-ui, sans-serif;
        color: #10362a;
        letter-spacing: -0.01em;
        opacity: 0;
        animation: gls-fade 0.4s 0.42s ease-out forwards;
      }
      @keyframes gls-out {
        to {
          opacity: 0;
          visibility: hidden;
          transform: scale(1.04);
        }
      }
      @keyframes gls-pop {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
      }
      @keyframes gls-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes gls-grow {
        to {
          transform: scale(1);
        }
      }
      @keyframes gls-fade {
        from {
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="gl-splash" aria-hidden="true">
      <svg class="gls-mark" viewBox="0 0 64 64" width="76" height="76" focusable="false">
        <rect width="64" height="64" rx="20" fill="#2b7a4b" />
        <path class="gls-stem" d="M32 53V27" stroke="#eaf4e4" stroke-width="4" stroke-linecap="round" fill="none" />
        <path class="gls-leaf1" d="M32 30c0-10 6-16 16-16 0 10-6 16-16 16Z" fill="#b6dd4c" />
        <path class="gls-leaf2" d="M32 39c0-8-5.2-13-14-13 0 8 5.2 13 14 13Z" fill="#eaf4e4" />
      </svg>
      <span class="gls-name">GreenLeaf Family</span>
    </div>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="padding:16px;font-family:system-ui">Для калькулятора и формы включите JavaScript. Тексты страницы доступны и без него.</p>
    </noscript>
    <script>
      // Появление блоков при прокрутке: [data-reveal] получает [data-shown], когда входит в экран.
      // Работает до загрузки приложения и не зависит от ленивой гидрации; новые узлы ловит MutationObserver.
      ;(function () {
        if (!document.documentElement.classList.contains('reveal')) return
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (e.isIntersecting) {
                e.target.setAttribute('data-shown', '')
                io.unobserve(e.target)
              }
            })
          },
          { rootMargin: '0px 0px -8% 0px' },
        )
        var watch = function (node) {
          if (!node || node.nodeType !== 1) return
          if (node.hasAttribute('data-reveal') && !node.hasAttribute('data-shown')) io.observe(node)
          node.querySelectorAll('[data-reveal]:not([data-shown])').forEach(function (el) {
            io.observe(el)
          })
        }
        watch(document.body)
        new MutationObserver(function (list) {
          list.forEach(function (m) {
            m.addedNodes.forEach(watch)
          })
        }).observe(document.body, { childList: true, subtree: true })
      })()
      // Переходы по якорям (меню в шапке): блоки ниже экрана не отрисованы (content-visibility),
      // их высоты оценочные — прыжок промахнулся бы. На время перехода рисуем всё, затем прокручиваем.
      ;(function () {
        var d = document.documentElement
        var timer
        var go = function (el, smooth) {
          d.classList.add('cv-all')
          void document.body.offsetHeight // точные высоты всех блоков
          el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' })
          clearTimeout(timer)
          timer = setTimeout(function () {
            d.classList.remove('cv-all') // высоты уже запомнены (contain-intrinsic-size: auto)
          }, 1600)
        }
        document.addEventListener('click', function (e) {
          if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
          var a = e.target && e.target.closest && e.target.closest('a[href^="#"]')
          if (!a) return
          var id = a.getAttribute('href').slice(1)
          if (!id || id === 'zayavka') return
          var el = document.getElementById(id)
          if (!el) return
          e.preventDefault()
          history.pushState(null, '', '#' + id)
          go(el, !matchMedia('(prefers-reduced-motion: reduce)').matches)
        })
        if (location.hash.length > 1 && location.hash !== '#zayavka') {
          window.addEventListener('load', function () {
            var el = document.getElementById(location.hash.slice(1))
            if (el) go(el, false)
          })
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
